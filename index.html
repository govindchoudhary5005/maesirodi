<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maa Electronics - होम</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Maa <span>Electronics</span></div>
            <ul>
                <li><a href="index.html" class="active">होम</a></li>
                <li><a href="about.html">हमारे बारे में</a></li>
                <li><a href="shop.html">दुकान व गैलरी</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>सौर ऊर्जा अपनाएं, बिजली बिल शून्य बनाएं</h1>
            <p>सिरोही की विश्वसनीय दुकान - Maa Electronics (maesirodi)</p>
            <a href="#apply" class="btn-main">अभी आवेदन करें</a>
        </div>
    </section>

    <div class="container" id="apply">
        <section class="apply-form">
            <h2>सोलर लगवाने हेतु आवेदन</h2>
            <form id="solarForm">
                <input type="text" id="cust_name" placeholder="आपका पूरा नाम" required>
                <input type="tel" id="cust_phone" placeholder="आपका मोबाइल नंबर" required>
                <select id="solar_type">
                    <option value="घरेलू (On-Grid)">घरेलू सोलर (On-Grid)</option>
                    <option value="ऑफ-ग्रिड (Battery)">ऑफ-ग्रिड सोलर (बैटरी के साथ)</option>
                    <option value="सोलर पंप (खेती)">सोलर पंप (खेती के लिए)</option>
                </select>
                <button type="button" class="btn-whatsapp" onclick="sendWhatsApp()">WhatsApp पर डिटेल्स भेजें</button>
            </form>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 Maa Electronics | डिज़ाइन बाय गोविंद चौधरी | ID: maesirodi</p>
    </footer>

    <script>
        function sendWhatsApp() {
            let myNumber = "919653884240";
            let name = document.getElementById('cust_name').value;
            let phone = document.getElementById('cust_phone').value;
            let type = document.getElementById('solar_type').value;

            if(name == "" || phone == "") {
                alert("कृपया नाम और नंबर भरें!");
                return;
            }

            let msg = `नमस्ते Maa Electronics,%0Aनया आवेदन प्राप्त हुआ है:%0A*नाम:* ${name}%0A*मोबाइल:* ${phone}%0A*प्रकार:* ${type}`;
            window.open(`https://wa.me/${myNumber}?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
